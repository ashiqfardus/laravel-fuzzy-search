name: CI

on:
  push:
    branches: [main, v2, "v2/**", "v2.*"]
  pull_request:
    branches: [main, v2, "v2.*"]

jobs:
  # ── SQLite ────────────────────────────────────────────────────────────────
  # Full PHP × Laravel matrix; no service containers needed
  test-sqlite:
    name: "PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / SQLite"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        laravel: ["10.*", "11.*", "12.*", "13.*"]
        exclude:
          - { php: "8.1", laravel: "11.*" }
          - { php: "8.1", laravel: "12.*" }
          - { php: "8.1", laravel: "13.*" }
          - { php: "8.2", laravel: "13.*" }  # testbench ^11 requires PHP ^8.3
          - { php: "8.5", laravel: "10.*" }  # Laravel 10 is not PHP 8.5 compatible
          - { php: "8.5", laravel: "11.*" }  # Laravel 11 is not PHP 8.5 compatible
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-
      - name: Allow dev stability for Laravel 13.x
        if: matrix.laravel == '13.*'
        run: composer config minimum-stability dev && composer config prefer-stable true
      - name: Install deps
        run: |
          # Composer >= 2.9 refuses to resolve framework versions that carry security
          # advisories. Laravel 10/11 are EOL upstream but still supported by this package,
          # so the advisory gate is disabled for CI installs only.
          composer config policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer install --no-interaction --prefer-dist
      - name: Run tests (SQLite)
        run: vendor/bin/phpunit --testsuite Unit,Feature,Legacy,Security,Integration

  # ── MySQL 8 ───────────────────────────────────────────────────────────────
  # Representative subset: PHP 8.2/8.3/8.4 × Laravel 10/12/13
  test-mysql:
    name: "PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / MySQL 8"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fuzzy_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        laravel: ["10.*", "12.*", "13.*"]
        exclude:
          - { php: "8.2", laravel: "13.*" }  # testbench ^11 requires PHP ^8.3
          - { php: "8.5", laravel: "10.*" }  # Laravel 10 is not PHP 8.5 compatible
    env:
      DB_TEST_DRIVER: mysql
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 3306
      DB_TEST_DATABASE: fuzzy_test
      DB_TEST_USERNAME: root
      DB_TEST_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-
      - name: Allow dev stability for Laravel 13.x
        if: matrix.laravel == '13.*'
        run: composer config minimum-stability dev && composer config prefer-stable true
      - name: Install deps
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer install --no-interaction --prefer-dist
      - name: Run tests (MySQL)
        run: vendor/bin/phpunit --testsuite Unit,Feature,Legacy,Security,Integration

  # ── PostgreSQL 14 ─────────────────────────────────────────────────────────
  # Representative subset: PHP 8.2/8.3/8.4 × Laravel 10/12/13
  test-pgsql:
    name: "PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / PostgreSQL 14"
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fuzzy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        laravel: ["10.*", "12.*", "13.*"]
        exclude:
          - { php: "8.2", laravel: "13.*" }  # testbench ^11 requires PHP ^8.3
          - { php: "8.5", laravel: "10.*" }  # Laravel 10 is not PHP 8.5 compatible
    env:
      DB_TEST_DRIVER: pgsql
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 5432
      DB_TEST_DATABASE: fuzzy_test
      DB_TEST_USERNAME: postgres
      DB_TEST_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pdo_sqlite
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-
      - name: Allow dev stability for Laravel 13.x
        if: matrix.laravel == '13.*'
        run: composer config minimum-stability dev && composer config prefer-stable true
      - name: Install deps
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer install --no-interaction --prefer-dist
      - name: Run tests (PostgreSQL)
        run: vendor/bin/phpunit --testsuite Unit,Feature,Legacy,Security,Integration

  # ── MariaDB 11.4 LTS ──────────────────────────────────────────────────────
  # Laravel 10 has no "mariadb" driver; the test harness falls back to "mysql" there.
  test-mariadb:
    name: "PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / MariaDB 11.4"
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: fuzzy_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        laravel: ["10.*", "12.*", "13.*"]
        exclude:
          - { php: "8.5", laravel: "10.*" }  # Laravel 10 is not PHP 8.5 compatible
    env:
      DB_TEST_DRIVER: mariadb
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 3306
      DB_TEST_DATABASE: fuzzy_test
      DB_TEST_USERNAME: root
      DB_TEST_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-
      - name: Allow dev stability for Laravel 13.x
        if: matrix.laravel == '13.*'
        run: composer config minimum-stability dev && composer config prefer-stable true
      - name: Install deps
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer install --no-interaction --prefer-dist
      - name: Run tests (MariaDB)
        run: vendor/bin/phpunit --testsuite Unit,Feature,Legacy,Security,Integration

  # ── SQL Server 2022 ───────────────────────────────────────────────────────
  # Developer edition container; the database is created from PHP before the run.
  test-sqlsrv:
    name: "PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / SQL Server 2022"
    runs-on: ubuntu-latest
    services:
      sqlsrv:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: FuzzyTest2026
          MSSQL_PID: Developer
        ports: ["1433:1433"]
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P FuzzyTest2026 -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        laravel: ["10.*", "12.*", "13.*"]
        exclude:
          - { php: "8.5", laravel: "10.*" }  # Laravel 10 is not PHP 8.5 compatible
    env:
      DB_TEST_DRIVER: sqlsrv
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 1433
      DB_TEST_DATABASE: fuzzy_test
      DB_TEST_USERNAME: sa
      DB_TEST_PASSWORD: FuzzyTest2026
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlsrv, pdo_sqlsrv, pdo_sqlite
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-
      - name: Allow dev stability for Laravel 13.x
        if: matrix.laravel == '13.*'
        run: composer config minimum-stability dev && composer config prefer-stable true
      - name: Install Microsoft ODBC Driver 18 (required by pdo_sqlsrv)
        run: |
          # packages-microsoft-prod.deb registers the apt repo and its signing key in one
          # step (piping the key through gpg fails on runners: "cannot open /dev/tty").
          curl -sSL -o /tmp/packages-microsoft-prod.deb "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
      - name: Install deps
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer install --no-interaction --prefer-dist
      - name: Create test database
        run: |
          php <<'PHP'
          <?php
          $pdo = new PDO(
              'sqlsrv:Server=127.0.0.1,1433;Database=master;TrustServerCertificate=1',
              'sa',
              getenv('DB_TEST_PASSWORD')
          );
          $pdo->exec("IF DB_ID('fuzzy_test') IS NULL CREATE DATABASE fuzzy_test");
          echo "fuzzy_test ready\n";
          PHP
      - name: Run tests (SQL Server)
        run: vendor/bin/phpunit --testsuite Unit,Feature,Legacy,Security,Integration

  # ── Filament v4 / v5 ──────────────────────────────────────────────────────
  # require-dev pins Filament v3 (it spans the whole matrix); this job swaps in v4 and v5.
  test-filament:
    name: "Filament ${{ matrix.filament }} / PHP 8.4 / Laravel 12 / SQLite"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        filament: ["^4.0", "^5.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, intl
          coverage: none
      - name: Install deps
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:12.*" --no-update --no-interaction
          composer require --dev "filament/filament:${{ matrix.filament }}" --no-update --no-interaction
          composer install --no-interaction --prefer-dist
      - name: Run the Filament integration tests
        run: vendor/bin/phpunit tests/Integration/Filament

  # ── Scout 10 ──────────────────────────────────────────────────────────────
  # composer.json allows laravel/scout ^10.0|^11.0, and every other job resolves 11.x.
  test-scout10:
    name: "Scout ^10 / PHP 8.4 / Laravel 12 / SQLite"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite
          coverage: none
      - name: Install deps
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:12.*" --no-update --no-interaction
          composer require --dev "laravel/scout:^10.0" --no-update --no-interaction
          composer install --no-interaction --prefer-dist
      - name: Run tests (SQLite, Scout 10)
        run: vendor/bin/phpunit --testsuite Unit,Feature,Legacy,Security,Integration
